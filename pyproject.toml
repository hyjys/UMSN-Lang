[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PyUMSN"
dynamic = ["version"]
description = "엄슨(UMSN) 프로그래밍 언어 — 엄슨 ↔ 파이썬 변환기, 실행기, UMSN-IDE"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hyjys" }]
keywords = ["umsn", "엄슨", "esolang", "korean", "programming-language", "transpiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: Korean",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Compilers",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/hyjys/UMSN-Lang"
Source = "https://github.com/hyjys/UMSN-Lang"
Issues = "https://github.com/hyjys/UMSN-Lang/issues"

[project.optional-dependencies]
libs = ["numpy", "pandas", "matplotlib"]
test = ["pytest"]
release = ["build", "twine"]

[project.scripts]
pyumsn = "pyumsn.cli:main"

[tool.setuptools]
packages = ["pyumsn", "pyumsn.ide"]

[tool.setuptools.package-data]
"pyumsn.ide" = ["*.umsn"]

[tool.setuptools.dynamic]
version = { attr = "pyumsn.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
